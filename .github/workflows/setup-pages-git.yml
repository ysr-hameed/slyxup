name: Setup Pages Git Integration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to connect slyxup-url-shortener-web to GitHub'
        required: true
        default: ""

jobs:
  connect-git:
    if: github.event.inputs.confirm == 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Connect GitHub repo to Cloudflare Pages
        run: |
          curl -s -X PATCH "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/slyxup-url-shortener-web" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "source": {
                "type": "github",
                "config": {
                  "owner": "ysr-hameed",
                  "repo_name": "slyxup",
                  "production_branch": "main",
                  "deploy_previews": false,
                  "deploy_on_push": true
                }
              },
              "build_config": {
                "build_command": "pnpm --filter @slyxup/url-shortener-web build",
                "destination_dir": "dist",
                "root_dir": "products/url-shortener/apps/web"
              }
            }' | jq .
