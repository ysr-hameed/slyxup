name: Deploy Platform Services

on:
  push:
    branches: [main]
    paths:
      - "platform/*/src/**"
      - "platform/*/wrangler.jsonc"
      - "platform/*/package.json"
      - "products/*/apps/api/src/**"
      - "products/*/apps/api/wrangler.jsonc"
      - "products/*/apps/web/**"
      - "packages/shared/src/**"
      - "packages/logger/src/**"
      - ".github/workflows/**"
      - "package.json"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changed.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || echo "")
          SERVICES=""
          for DIR in platform/*/; do
            NAME=$(basename "$DIR")
            if echo "$CHANGED" | grep -q "^platform/$NAME/"; then
              SERVICES="$SERVICES $NAME"
            fi
          done
          for DIR in products/*/; do
            NAME=$(basename "$DIR")
            if echo "$CHANGED" | grep -q "^products/$NAME/"; then
              SERVICES="$SERVICES product-$NAME"
            fi
          done
          echo "services=$SERVICES" >> $GITHUB_OUTPUT
          echo "Services to deploy: $SERVICES"

  deploy-auth:
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.services, 'auth-service')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Set API Key Secret
        run: echo "${{ secrets.API_KEY }}" | npx wrangler secret put API_KEY --name slyxup-auth --force || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Auth Service
        working-directory: platform/auth-service
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Auth Service
        id: verify-auth
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://auth.slyxup.online/api/auth/me")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if echo "$STATUS" | grep -qE "401|200"; then echo "✅ auth.slyxup.online is live"; else echo "❌ auth.slyxup.online returned $STATUS"; fi

  deploy-billing:
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.services, 'billing-service')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Deploy Billing Service
        working-directory: platform/billing-service
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Billing Service
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://billing.slyxup.online/api/billing/plans")
          if echo "$STATUS" | grep -q "200"; then echo "✅ billing.slyxup.online is live"; else echo "❌ billing.slyxup.online returned $STATUS"; fi

  deploy-email:
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.services, 'email-service')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Set API Key Secret
        run: echo "${{ secrets.API_KEY }}" | npx wrangler secret put API_KEY --name slyxup-email --force || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Email Service
        working-directory: platform/email-service
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Email Service
        id: verify-email
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://email.slyxup.online/api/email/send" -X POST -H "Content-Type: application/json" -d '{"to":[],"subject":"","html":""}')
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if echo "$STATUS" | grep -qE "400|401|200"; then echo "✅ email.slyxup.online is live"; else echo "❌ email.slyxup.online returned $STATUS"; fi

  deploy-analytics:
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.services, 'analytics-service')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Deploy Analytics Service
        working-directory: platform/analytics-service
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Analytics Service
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://analytics.slyxup.online/api/analytics/summary")
          if echo "$STATUS" | grep -qE "401|200"; then echo "✅ analytics.slyxup.online is live"; else echo "❌ analytics.slyxup.online returned $STATUS"; fi

  deploy-storage:
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.services, 'storage-service')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Deploy Storage Service
        working-directory: platform/storage-service
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Storage Service
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://storage.slyxup.online/api/storage/list")
          if echo "$STATUS" | grep -qE "401|200"; then echo "✅ storage.slyxup.online is live"; else echo "❌ storage.slyxup.online returned $STATUS"; fi

  deploy-admin:
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.services, 'admin-service')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Deploy Admin Service
        working-directory: platform/admin-service
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Admin Service
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://admin.slyxup.online/api/admin/dashboard")
          if echo "$STATUS" | grep -qE "401|200"; then echo "✅ admin.slyxup.online is live"; else echo "❌ admin.slyxup.online returned $STATUS"; fi

  deploy-notification:
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.services, 'notification-service')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Deploy Notification Service
        working-directory: platform/notification-service
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Notification Service
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://notification.slyxup.online/api/notification/logs")
          if echo "$STATUS" | grep -qE "401|200"; then echo "✅ notification.slyxup.online is live"; else echo "❌ notification.slyxup.online returned $STATUS"; fi

  deploy-url-shortener:
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.services, 'product-url-shortener')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install

      - name: Set API Key Secret
        run: echo "${{ secrets.API_KEY }}" | npx wrangler secret put API_KEY --name slyxup-url-shortener --force || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 Migrations
        working-directory: products/url-shortener/apps/api
        run: npx wrangler d1 migrations apply slyxup-url-shortener --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy URL Shortener API
        working-directory: products/url-shortener/apps/api
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify URL Shortener API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api-url.slyxup.online/api/url")
          if echo "$STATUS" | grep -qE "401|200"; then echo "✅ api-url.slyxup.online is live"; else echo "❌ api-url.slyxup.online returned $STATUS"; fi

      - name: Build & Deploy URL Shortener Web
        working-directory: products/url-shortener/apps/web
        run: |
          pnpm vite build
          pnpm wrangler pages deploy dist --project-name slyxup-url-shortener-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify URL Shortener Web
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://url.slyxup.online")
          if echo "$STATUS" | grep -q "200"; then echo "✅ url.slyxup.online is live"; else echo "❌ url.slyxup.online returned $STATUS"; fi

  summary:
    if: always()
    needs:
      - detect-changes
      - deploy-auth
      - deploy-billing
      - deploy-email
      - deploy-analytics
      - deploy-storage
      - deploy-admin
      - deploy-notification
      - deploy-url-shortener
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "SERVICES=${{ needs.detect-changes.outputs.services }}"
      - name: Deploy Summary
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "              Deploy Platform Services — Summary"
          echo "═══════════════════════════════════════════════════════════"
          echo "  Auth:        ${{ needs.deploy-auth.result        || 'skipped' }}"
          echo "  Billing:     ${{ needs.deploy-billing.result     || 'skipped' }}"
          echo "  Email:       ${{ needs.deploy-email.result       || 'skipped' }}"
          echo "  Analytics:   ${{ needs.deploy-analytics.result   || 'skipped' }}"
          echo "  Storage:     ${{ needs.deploy-storage.result     || 'skipped' }}"
          echo "  Admin:       ${{ needs.deploy-admin.result       || 'skipped' }}"
          echo "  Notification:${{ needs.deploy-notification.result || 'skipped' }}"
          echo "  URL Shortener:${{ needs.deploy-url-shortener.result || 'skipped' }}"
          echo "═══════════════════════════════════════════════════════════"
          if [[ "${{ needs.deploy-url-shortener.result }}" == "success" ]]; then
            echo "  ✅ All services deployed successfully!"
          elif [[ "${{ needs.deploy-url-shortener.result }}" == "skipped" ]]; then
            echo "  ℹ️  No code changes detected — nothing to deploy"
          else
            echo "  ⚠️  Some services failed — check logs above"
          fi
          echo "═══════════════════════════════════════════════════════════"
