name: Check CF Token Permissions

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Cloudflare API Token
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          echo "=== Token Verification ==="
          RESPONSE=$(curl -s -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json")
          echo "$RESPONSE" | jq .
          echo ""
          echo "=== Parsed Permissions ==="
          echo "$RESPONSE" | jq -r '.result.policies[] | "Policy: \(.resource_groups[0].scope_objects[0].objects[0].key // .resource_groups[0].scope |> tostring)"' 2>/dev/null || echo "  Could not parse policies"
          echo ""
          echo "=== Effect on Actions ==="
          echo "D1 Write:      $(echo "$RESPONSE" | jq -r 'if .result.policies[] | select(.permission_groups[] | .name | test("D1"; "i")) then "YES" else "NO" end' 2>/dev/null || echo 'NO')"
          echo "Workers Write: $(echo "$RESPONSE" | jq -r 'if .result.policies[] | select(.permission_groups[] | .name | test("Worker"; "i")) then "YES" else "NO" end' 2>/dev/null || echo 'NO')"
          echo "Pages Write:   $(echo "$RESPONSE" | jq -r 'if .result.policies[] | select(.permission_groups[] | .name | test("Pages"; "i")) then "YES" else "NO" end' 2>/dev/null || echo 'NO')"
          echo "Account ID:    $(echo "$RESPONSE" | jq -r '.result.id // "unknown"')"
